# Every push to main: the same hooks as local commits, the test suite with its coverage
# gate, real-browser and accessibility tests, a secret scan of the whole history, a
# vulnerability audit of production dependencies and the repository size budget.
# Third-party actions are pinned to full commit SHAs; the comment names the release.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays 09:00 IST: catch vulnerabilities published since the last push.
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Pre-commit hooks (ruff, mypy, secrets, file rules)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Tests with the 95% branch-coverage gate
        run: uv run pytest -W error --cov=app

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Journeys, axe (WCAG 2.2 AA), phone width, keyboard, console
        run: uv run pytest -W error -m e2e

  security:
    name: Secrets, dependencies and size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan of the full git history (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Known vulnerabilities in production dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip --progress-spinner off
      - name: Repository size including history (budget 8 MB, limit 10 MB)
        run: scripts/hooks/check_repo_size.sh
