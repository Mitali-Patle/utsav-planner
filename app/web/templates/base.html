<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI-assisted event planning for Indian weddings, birthdays, and community celebrations, covering budgets, timelines, vendor checklists, and personalized ideas.">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "attributesToSettle": ["class", "width", "height"], "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "(404|409|422)", "swap": true, "error": false}, {"code": "...", "swap": false, "error": true}]}'>
  <title>{% block title %}Utsav Planner - AI Indian Event Planning{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body hx-headers='{{ {"X-CSRF-Token": csrf_token} | tojson }}'>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <div class="container">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/" class="site-brand" aria-label="Utsav Planner homepage">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="5" y="5" width="14" height="14" fill="currentColor"/>
            <rect x="5" y="5" width="14" height="14" fill="currentColor" transform="rotate(45 12 12)"/>
            <rect x="9.5" y="9.5" width="5" height="5" class="brand-mark-centre" transform="rotate(45 12 12)"/>
          </svg>
          <span>Utsav <span class="brand-sub">Planner</span></span>
        </a>
        <ul class="site-nav-links" role="list">
          <li>
            <a href="/plans" class="nav-plans"{% if request.url.path == "/plans" %} aria-current="page"{% endif %}>
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="3.5" width="16" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8.5h8M8 12h8M8 15.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              My plans
            </a>
          </li>
          <li>
            <button type="button" id="theme-toggle" class="theme-toggle" hidden aria-label="Theme: Auto. Change theme">
              <svg class="theme-icon theme-icon-auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
              <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg>
              <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
              <span class="theme-label">Auto</span>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <div id="status-region" class="status-region" aria-live="polite" aria-atomic="true">
    {% for item in flashes %}{% set kind = item.kind %}{% set message = item.message %}{% include "partials/notice.html" %}{% endfor %}
  </div>

  <main id="main" class="site-main" tabindex="-1">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; Utsav Planner. Built for Indian celebrations.</p>
    </div>
  </footer>
</body>
</html>
