{#- The home page's celebration photos: pinned to the right edge on wide screens (body
    class page-split), a sideways strip on phones. Listed twice for a seamless loop;
    reel.js runs it. -#}
<div class="reel" data-reel>
  <div class="reel-window">
    <ul class="reel-track" role="list">
      {% for copy in [1, 2] %}{% for slide in slides %}
      <li class="reel-slide"{% if copy == 2 %} aria-hidden="true"{% endif %}>
        <div class="reel-frame reel-tone-{{ loop.index }}">
          <img src="/static/img/celebrations/{{ slide.image }}" alt="{{ slide.alt if copy == 1 else '' }}" width="800" height="600"{% if not loop.first or copy == 2 %} loading="lazy"{% endif %}>
        </div>
      </li>
      {% endfor %}{% endfor %}
    </ul>
  </div>
  <button type="button" class="reel-toggle" hidden>
    <span class="sr-only">Pause pictures</span>
    <svg class="reel-icon-pause" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>
    <svg class="reel-icon-play" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M4 2l10 6-10 6z"/></svg>
  </button>
</div>
