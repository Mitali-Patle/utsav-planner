[project]
name = "utsav-planner"
version = "0.1.0"
description = "GenAI planning assistant for Indian weddings, birthdays and community events."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.158.0",
    "google-genai>=2.32.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "S",        # bandit (security)
  "SIM",      # simplify
  "C4",       # comprehensions
  "RET",      # return
  "PTH",      # pathlib
  "D",        # docstrings
  "ANN",      # annotations
  "PL",       # pylint
  "RUF",      # ruff-specific
]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D", "ANN", "PLR2004", "PLR0913"]
"scripts/**" = ["T201"]
# FastAPI routes receive one argument per form field or injected dependency.
"app/web/routes/**" = ["PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/domain", "app/ai"]
pythonpath = ["."]
addopts = "-q --strict-markers --doctest-modules"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/index.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.vercel]
entrypoint = "app.index:app"
